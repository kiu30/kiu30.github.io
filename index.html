<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>구술</title>
<style>
:root{
  --bg:#101418; --panel:#181e25; --panel2:#1f2731; --line:#2b3540;
  --tx:#dce4ec; --dim:#8b98a5; --acc:#4fc3f7; --acc2:#ffb74d;
  --mark:#ffd54f; --star:#ff8a65; --ok:#81c784; --del:#e57373;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--tx); font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; font-size:15px; line-height:1.65;}
header{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left)); transition:transform .22s ease;}
body.hdr-hide header{transform:translateY(-100%);}
.card{scroll-margin-top:calc(var(--hh,0px) + 8px);}
h1{font-size:17px; color:var(--acc); margin-bottom:8px;}
h1 small{color:var(--dim); font-weight:normal; font-size:12px; margin-left:8px;}
#q{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--tx); font-size:15px; outline:none;}
#q:focus{border-color:var(--acc);}
.catbar{margin-top:8px;}
#catToggle{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; user-select:none; font-size:13.5px; color:var(--dim);}
#catToggle b{color:var(--acc); flex:1;}
#catToggle:hover{border-color:var(--acc);}
#chips{display:none; flex-direction:column; margin-top:6px; max-height:52vh; max-height:45dvh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); -webkit-overflow-scrolling:touch;}
.catbar.open #chips{display:flex;}
.catbar.open #catArrow{transform:rotate(180deg);}
.crow2{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; user-select:none;}
.crow2:last-child{border-bottom:none;}
.crow2:hover{background:var(--panel2);}
.crow2 .cn{color:var(--dim); font-size:12px; background:var(--panel2); border-radius:10px; padding:1px 9px; min-width:30px; text-align:center;}
.crow2.on{background:rgba(79,195,247,.12); color:var(--acc); font-weight:bold; box-shadow:inset 3px 0 0 var(--acc);}
.crow2.on .cn{background:var(--acc); color:#06232f;}
.chip{padding:4px 11px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:12.5px; cursor:pointer; user-select:none;}
.chip.on{background:var(--acc); color:#06232f; border-color:var(--acc); font-weight:bold;}
#stat{color:var(--dim); font-size:12px; margin-top:6px;}
main{max-width:860px; margin:0 auto; padding:14px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden;}
.card.hide{display:none;}
.hd{display:flex; align-items:baseline; gap:8px; padding:10px 14px; cursor:pointer;}
.hd:hover{background:var(--panel2);}
.no{color:var(--acc2); font-weight:bold; font-size:14px; white-space:nowrap;}
.tt{font-weight:bold; font-size:15px; flex:1;}
.tt .imp{color:var(--star); font-size:12px; margin-left:5px;}
.cat-tag{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:1px 8px; white-space:nowrap;}
.bd{display:none; padding:4px 16px 14px 16px; border-top:1px solid var(--line);}
.card.open .bd{display:block;}
.bd ol{list-style:none; margin-top:6px;}
.bd ol li{padding-left:26px; position:relative; margin-bottom:3px;}
.bd ol li::before{content:attr(data-n); position:absolute; left:0; color:var(--acc); font-weight:bold;}
.ph{color:var(--acc2); font-weight:bold; margin-top:8px;}
.nt{color:var(--dim); font-size:13.5px; margin-top:8px; padding-left:10px; border-left:2px solid var(--line);}
mark{background:var(--mark); color:#222; border-radius:2px; padding:0 1px;}
.btns{display:flex; gap:8px; margin-top:8px;}
.btn{flex:1; text-align:center; padding:6px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:12.5px; cursor:pointer;}
.btn:hover{color:var(--tx);}
.empty{text-align:center; color:var(--dim); padding:40px 0;}
footer{text-align:center; color:var(--dim); font-size:11.5px; padding:20px 0 calc(30px + env(safe-area-inset-bottom));}
@media (max-width:520px){
  .act{padding:8px 13px; font-size:13px;}
  .acts{flex-wrap:wrap; justify-content:flex-start;}
  .btn{padding:9px 4px;}
  .crow2{padding:12px 14px;}
  .hd{padding:12px 12px;}
  #gear{width:40px; height:40px;}
  #menu .mi{padding:12px 14px;}
}
/* 카드 하단 액션 */
.acts{display:flex; gap:6px; margin-top:12px; justify-content:flex-end;}
.act{padding:4px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:12px; cursor:pointer;}
.act:hover{color:var(--tx);}
.act.danger:hover{color:var(--del); border-color:var(--del);}
/* 편집 폼 */
.ed{padding:12px 16px 16px; border-top:1px solid var(--line);}
.ed label{display:block; color:var(--dim); font-size:12px; margin:10px 0 3px;}
.ed input[type=text], .ed textarea{width:100%; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-size:14px; font-family:inherit; outline:none;}
.ed input:focus, .ed textarea:focus{border-color:var(--acc);}
.ed textarea{resize:vertical; line-height:1.5;}
.ed .row{display:flex; gap:8px;}
.ed .row > div{flex:1;}
.ed .chk{display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--dim); font-size:13px; cursor:pointer;}
.srow{display:flex; gap:6px; margin-bottom:6px; align-items:flex-start;}
.srow .s-l{flex:0 0 110px;}
.srow .s-t{flex:1;}
.srow .sdel{cursor:pointer; color:var(--dim); padding:8px 6px; font-size:14px;}
.srow .sdel:hover{color:var(--del);}
.addsec{display:inline-block; margin-top:2px; padding:5px 13px; border-radius:7px; border:1px dashed var(--line); color:var(--dim); font-size:12.5px; cursor:pointer;}
.addsec:hover{color:var(--acc); border-color:var(--acc);}
.ed .save-row{display:flex; gap:8px; margin-top:14px;}
.ed .sbtn{flex:1; padding:8px; border-radius:8px; border:none; font-size:14px; font-weight:bold; cursor:pointer;}
.ed .sbtn.save{background:var(--acc); color:#06232f;}
.ed .sbtn.cancel{background:var(--panel2); color:var(--dim); border:1px solid var(--line);}
/* 설정 메뉴 */
.hrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; position:relative;}
.hrow h1{margin-bottom:0; flex:1;}
#gear{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none;}
#gear:hover{color:var(--tx); border-color:var(--acc);}
#menu{display:none; position:absolute; top:40px; right:0; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:170px; box-shadow:0 6px 20px rgba(0,0,0,.5); z-index:20;}
#menu.show{display:block;}
#menu .mi{padding:9px 12px; border-radius:7px; color:var(--tx); font-size:13.5px; cursor:pointer; white-space:nowrap;}
#menu .mi:hover{background:var(--panel);}
#menu .mi.danger:hover{color:var(--del);}
/* 모달 */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:30; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; width:100%; max-width:420px; max-height:80vh; max-height:calc(100dvh - 40px - env(safe-area-inset-top)); overflow:auto;}
.modal h2{font-size:15px; color:var(--acc); margin-bottom:10px;}
.crow{display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid var(--line); font-size:14px;}
.crow .cname{flex:1;}
.crow .ccnt{color:var(--dim); font-size:12px;}
.crow .cbtn{padding:3px 9px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:12px; cursor:pointer;}
.crow .cbtn:hover{color:var(--tx);}
.crow .cbtn.d:hover{color:var(--del); border-color:var(--del);}
.modal .mbtns{display:flex; gap:8px; margin-top:14px;}
.modal .mb{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-size:13.5px; cursor:pointer; text-align:center;}
.modal .mb:hover{border-color:var(--acc);}
/* 표시 켜기/끄기 */
.trow{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; user-select:none;}
.trow .sw{width:38px; height:20px; border-radius:11px; background:var(--panel2); border:1px solid var(--line); position:relative; transition:.15s;}
.trow .sw::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--dim); transition:.15s;}
.trow.on .sw{background:var(--acc); border-color:var(--acc);}
.trow.on .sw::after{left:20px; background:#06232f;}
/* 컨트롤 접기 */
body.ctrl-fold #q, body.ctrl-fold .catbar, body.ctrl-fold .btns, body.ctrl-fold #stat{display:none;}
#foldBtn{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none; margin-left:auto; margin-right:8px;}
#foldBtn:hover{color:var(--tx); border-color:var(--acc);}
@media (max-width:520px){ #foldBtn{width:40px; height:40px;} }
/* 기출: 문제 → 정답창 */
.qlist{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.qbtn{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); cursor:pointer; user-select:none;}
.qbtn:hover{border-color:var(--acc);}
.qbtn .qn{flex:none; width:26px; height:26px; border-radius:50%; background:var(--acc); color:#06232f; font-weight:bold; font-size:13px; display:flex; align-items:center; justify-content:center;}
.qbtn .qt{flex:1; font-size:14.5px; line-height:1.4;}
.qbtn .qs{flex:none; font-size:11.5px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:1px 8px;}
.qbtn .qa{flex:none; color:var(--acc); font-size:13px; font-weight:bold;}
.qbtn.bad{opacity:.55; cursor:default;}
.qbtn.bad .qn{background:var(--dim);}
.qbtn.bad .qa{color:var(--warn,#ef5350);}
.qcount{font-size:11.5px; color:var(--acc); border:1px solid var(--acc); border-radius:10px; padding:1px 8px; margin-left:6px; white-space:nowrap;}
#ansOv{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300; display:none; align-items:flex-end; justify-content:center;}
#ansOv.show{display:flex;}
#ansBox{background:var(--bg); border:1px solid var(--line); border-bottom:none; border-radius:16px 16px 0 0; width:100%; max-width:760px; max-height:88vh; max-height:calc(100dvh - 16px - env(safe-area-inset-top)); display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.4);}
@media(min-width:700px){ #ansOv{align-items:center;} #ansBox{border-radius:14px; border-bottom:1px solid var(--line); max-height:84vh; max-height:84dvh;} }
#ansHead{padding:14px 16px 10px; border-bottom:1px solid var(--line);}
#ansHead .ah1{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim);}
#ansHead .ah1 .x{margin-left:auto; font-size:20px; cursor:pointer; padding:0 4px; color:var(--dim);}
#ansHead .aq{font-size:16px; font-weight:bold; margin-top:6px; line-height:1.45;}
#ansBody{padding:6px 16px 14px; overflow-y:auto; -webkit-overflow-scrolling:touch; line-height:1.65;}
#ansBody .src{display:inline-block; margin-top:10px; font-size:12px; color:var(--acc); border:1px solid var(--acc); border-radius:10px; padding:1px 9px;}
#ansBody .at{font-weight:bold; margin-top:8px;}
#ansBody ol{list-style:none; padding:0; margin-top:6px;}
#ansBody ol li{margin:5px 0; padding-left:26px; position:relative;}
#ansBody ol li::before{content:attr(data-n); position:absolute; left:0; color:var(--acc); font-weight:bold;}
#ansBody .hide-ans{margin-top:12px; padding:22px; text-align:center; border:1px dashed var(--acc); border-radius:10px; color:var(--acc); cursor:pointer; font-weight:bold;}
#ansFoot{display:flex; gap:8px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);}
#ansFoot button{flex:1; padding:11px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--fg,#e6edf3); font-size:14px; cursor:pointer;}
#ansFoot button:disabled{opacity:.35; cursor:default;}
#ansFoot .hidetg{flex:none; padding:11px 12px;}
#ansFoot .hidetg.on{border-color:var(--acc2); color:var(--acc2);}
.ptitle{margin:12px 0 2px; font-size:13px; font-weight:bold; color:var(--acc2); display:flex; align-items:center; gap:8px;}
.ptitle::after{content:""; flex:1; height:1px; background:var(--line);}
.qlist .ptitle:first-child{margin-top:0;}
#ansPart{color:var(--acc2); font-weight:bold;}
.epart{border:1px solid var(--line); border-radius:9px; padding:8px; margin:6px 0;}
.epart .eph{display:flex; align-items:center; justify-content:space-between; font-weight:bold; color:var(--acc2); font-size:13.5px;}
.epart .eadd{font-size:12.5px; color:var(--acc); border:1px solid var(--acc); border-radius:7px; padding:3px 10px; cursor:pointer; font-weight:normal;}
.epart.act{border-color:var(--acc);}
.epart.act .eadd{background:var(--acc); color:#06232f;}
/* 기출 편집: 연결 문제 */
.rlist{display:flex; flex-direction:column; gap:6px; margin:6px 0;}
.rrow{display:flex; gap:6px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:7px; background:var(--panel2);}
.rrow .rn{flex:none; color:var(--acc); font-weight:bold; padding-top:6px; width:20px; text-align:center;}
.rrow .rmain{flex:1; min-width:0;}
.rrow .rsrc{font-size:12px; color:var(--dim); margin-bottom:4px;}
.rrow .rsrc b{color:var(--acc);}
.rrow input,.rrow textarea{width:100%;}
.rrow textarea{margin-top:4px;}
.rrow .rb{flex:none; display:flex; flex-direction:column; gap:3px;}
.rrow .rb span{cursor:pointer; padding:2px 7px; border:1px solid var(--line); border-radius:5px; font-size:12px; text-align:center;}
.rpick{border:1px solid var(--line); border-radius:8px; margin-top:4px;}
.rpick .rtabs{display:flex; gap:4px; padding:6px;}
.rpick .rtabs span{padding:4px 10px; border-radius:6px; border:1px solid var(--line); font-size:12.5px; cursor:pointer;}
.rpick .rtabs span.on{background:var(--acc); color:#06232f; border-color:var(--acc);}
.rpick input{margin:0 6px 6px; width:calc(100% - 12px);}
.rres{max-height:220px; overflow-y:auto; border-top:1px solid var(--line);}
.rres div{padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;}
.rres div:hover{background:var(--panel2);}
.rres div small{color:var(--dim); margin-right:6px;}
/* 공지 */
#noticeOv{padding:16px calc(8px + env(safe-area-inset-right)) 16px calc(8px + env(safe-area-inset-left));}
#noticeOv .modal{width:100%; max-width:620px; padding:22px 22px 18px;}
@media(max-width:520px){ #noticeOv{padding-left:calc(6px + env(safe-area-inset-left)); padding-right:calc(6px + env(safe-area-inset-right));} #noticeOv .modal{padding:20px 16px 16px;} }
#noticeOv h2{font-size:17px; color:var(--tx); margin-bottom:12px;}
#noticeOv .nb{font-size:14.5px; line-height:1.7; color:var(--tx);}
#noticeOv .nl{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
#noticeOv .nl div{font-size:13.5px; line-height:1.6; margin:5px 0; color:var(--dim);}
#noticeOv .nl b{color:var(--acc); font-weight:bold; margin-right:6px;}
#noticeOv .nu{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
#noticeOv .nu .nh{font-size:13px; font-weight:bold; color:var(--acc2); margin-bottom:6px;}
#noticeOv .nu ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.65; max-height:30dvh; overflow-y:auto;}
#noticeOv .mb{background:var(--acc); color:#06232f; border-color:var(--acc); font-weight:bold; padding:10px;}
.modal.ned label{display:block; font-size:12.5px; color:var(--dim); margin:10px 0 4px;}
.modal.ned input, .modal.ned textarea{width:100%; box-sizing:border-box; background:var(--bg); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; line-height:1.5;}
#noticeOv{z-index:60;}
/* 편집 모드 */
body:not(.editmode) .edonly, body:not(.editmode) .acts{display:none !important;}
body.editmode header{box-shadow:inset 0 3px 0 var(--acc2);}
#expTab{border-color:var(--acc2); color:var(--acc2);}
#expTab.dirty{background:var(--acc2); color:#2a1a00; font-weight:bold;}
.edbanner{display:none; background:rgba(255,183,77,.12); border:1px solid var(--acc2); color:var(--acc2); border-radius:8px; padding:7px 12px; font-size:12.5px; margin-bottom:8px;}
body.editmode .edbanner{display:block;}
/* 퀵 탭 */
.tabs{display:flex; gap:6px; align-items:center; margin-bottom:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.tab{padding:7px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:13.5px; cursor:pointer; white-space:nowrap; user-select:none;}
.tab.on{background:var(--acc); color:#06232f; border-color:var(--acc); font-weight:bold;}
.tabsp{flex:1; min-width:8px;}
@media(max-width:520px){
  .tabs{flex-wrap:wrap; overflow:visible;}
  .tabs .tab:not(.edonly):not([onclick^="forceUpdate"]){flex:1 1 0; text-align:center; padding:7px 4px;}
  .tabsp{display:none;}
  .tabs .tab.edonly, .tabs .tab[onclick^="forceUpdate"]{flex:1 1 40%; text-align:center;}
}
#quizPane{display:none;}
body.mode-quiz #quizPane{display:block; position:fixed; left:0; right:0; bottom:0; background:var(--bg); z-index:40;}
#quizPane iframe{width:100%; height:100%; border:none; background:var(--bg);}
body.mode-quiz .hrow, body.mode-quiz #q, body.mode-quiz .catbar, body.mode-quiz .btns, body.mode-quiz #stat, body.mode-quiz main, body.mode-quiz footer{display:none;}
/* 퀴즈 오버레이 */
#quizOv{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;}
#quizOv .qbar{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); padding-top:calc(10px + env(safe-area-inset-top));}
#quizOv .qbar b{color:var(--acc); font-size:15px;}
#quizOv .qx{padding:7px 16px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--tx); cursor:pointer; font-size:13.5px;}
#quizOv iframe{flex:1; border:none; width:100%;}
/* 웹 연결 배너 */
.webbar{max-width:860px; margin:10px auto 0; padding:0 14px;}
.webbar a{display:block; text-align:center; padding:11px; border-radius:9px; background:var(--acc); color:#06232f; font-weight:bold; text-decoration:none; font-size:14px;}
</style>
</head>
<body>
<header>
  <div class="tabs">
    <div class="tab on" id="tabMain" onclick="switchWorkspace('main')">📚 구술</div>
    <div class="tab" id="tabPrac" onclick="switchWorkspace('prac')">🛠 기능</div>
    <div class="tab" id="tabQuiz" onclick="switchTab('quiz')">🎯 퀴즈</div>
    <div class="tab" id="tabExam" onclick="switchWorkspace('exam')">📝 기출 시나리오</div>
    <div class="tabsp"></div>
    <div class="tab" onclick="forceUpdate()">🔄 업데이트</div>
  </div>
  <div class="hrow">
    <h1><span id="siteTitle">구술</span> <small>총 <span id="tot">108</span>문항 <span id="saved" style="color:var(--ok)"></span></small></h1>
    <div id="foldBtn" onclick="toggleFold()">▲</div>
  </div>

function exportHTML(){
  stash();
  const out={v:2, ts:Date.now()};
  ['main','prac','exam'].forEach(w=>{
    const src = STORE[w] || (EMBED && EMBED[w]) || wsDefaults(w);
    out[w]={data:src.data.map(d=>{ const c=Object.assign({},d); delete c._new; return c; }), meta:src.meta||{}};
  });
  // 직전 업로드본과 비교 → 새로 생기거나 바뀐 문항 제목
  let prev=null;
  try{ prev=JSON.parse(safeLS(()=>localStorage.getItem(LASTEXPKEY))||'null'); }catch(e){}
  if(!prev) prev=EMBED;
  const titles=[];
  ['main','prac','exam'].forEach(w=>{
    const old=new Set(((prev&&prev[w]&&prev[w].data)||[]).map(d=>d.nid).filter(Boolean));
    out[w].data.forEach(d=>{ if(d.nid && !old.has(d.nid) && d.title) titles.push(d.title); });
  });
  out.notice=NOTICE||fileNotice();
  if(titles.length) out.upd={ts:out.ts, titles:titles};
  else if(prev && prev.upd) out.upd=prev.upd;
  safeLS(()=>localStorage.setItem(LASTEXPKEY, JSON.stringify(out)));
  const json=JSON.stringify(out).replace(/</g,'\\u003c');
  const open='<script id="embed" type="application/json">';
  const a=PRISTINE.indexOf(open)+open.length, b=PRISTINE.indexOf('<\/script>',a);
  let html=PRISTINE.slice(0,a)+json+PRISTINE.slice(b);
  html=html.replace(/<!--E-->[\s\S]*?<!--\/E-->/g,'').replace('const VIEW_ONLY=false;','const VIEW_ONLY=true;');
  const blob=new Blob([html],{type:'text/html'});
  const name='index.html';
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const done=()=>{ setDirty(false); };
  if(isIOS && navigator.canShare){
    try{ const f=new File([blob],name,{type:'text/html'}); if(navigator.canShare({files:[f]})){ navigator.share({files:[f]}).then(done).catch(()=>{}); return; } }catch(e){}
  }
  const l=document.createElement('a'); l.href=URL.createObjectURL(blob); l.download=name; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),2000);
  done();
}

async function fetchRemoteVer(){
  const r=await fetch(dataURL()+'?u='+Date.now(), {cache:'no-store', headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
  if(!r.ok) return null;
  const t=await r.text();
  const m=t.match(/id="embed" type="application\/json">([\s\S]*?)<\/script>/);
  return m ? hashStr(m[1].trim()) : null;
}
function reloadFresh(){ location.replace(location.pathname+'?v='+Date.now()+location.hash); }
async function checkUpdate(){
  if(!VIEW_ONLY) return;
  if(location.protocol!=='https:' && location.protocol!=='http:') return;
  try{
    const rv=await fetchRemoteVer();
    if(rv && rv!==EMBED_VER){
      if(editingIdx===null && !EDITMODE && !DIRTY) reloadFresh(); else showUpdateBar();
    }
  }catch(e){}
}
async function forceUpdate(){
  if(location.protocol!=='https:' && location.protocol!=='http:'){ alert('웹에서만 가능'); return; }

    const rv=await fetchRemoteVer();

}

function moveCard(i, dir){

function moveTo(i){

  if(!key){ alert('문항 번호를 입력'); return; }
  if(key===DATA[i].num) return;
  const [item]=DATA.splice(i,1);
  let n;
  if(key==='0'){ n=0; }
  else{
    const idx=DATA.findIndex(d=>String(d.num)===key);
    if(idx<0){
      DATA.splice(i,0,item); // 원위치 복구
      alert('없는 번호');
      return;
    }
    n=idx+1;
  }
  DATA.splice(n,0,item);
  persist(); build();
  const el=list.querySelector(`.card[data-i="${n}"]`);

}

// ===== 카테고리 관리 =====
function allCats(){ return [...new Set([...DATA.map(d=>d.cat), ...META.extraCats])]; }
function openCatMgr(){
  closeCatMgr();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='catOv';
  ov.onclick=e=>{ if(e.target===ov) closeCatMgr(); };
  const md=document.createElement('div'); md.className='modal';
  md.innerHTML='<h2>🗂 카테고리 관리</h2><div id="catRows"></div><div class="mbtns"><div class="mb" id="catAdd">＋ 새 카테고리</div><div class="mb" id="catClose">닫기</div></div>';
  ov.appendChild(md); document.body.appendChild(ov);
  md.querySelector('#catAdd').onclick=()=>{
    const n=prompt('새 카테고리');
    if(!n||!n.trim()) return;
    const names=n.split(',').map(s=>s.trim()).filter(Boolean);
    let added=0, skipped=[];
    names.forEach(name=>{
      if(allCats().includes(name)){ skipped.push(name); return; }
      META.extraCats.push(name); added++;
    });
    if(added) { persist(); rebuildChips(); renderCatRows(); }
    if(skipped.length) alert('이미 있음: '+skipped.join(', '));
    else if(added>1) alert(added+'개 카테고리 추가됨');
  };
  md.querySelector('#catClose').onclick=closeCatMgr;
  renderCatRows();
}
function closeCatMgr(){ const o=document.getElementById('catOv'); if(o) o.remove(); }
function renderCatRows(){
  const box=document.getElementById('catRows'); if(!box) return;
  box.innerHTML="";
  allCats().forEach(cat=>{
    const cnt=DATA.filter(d=>d.cat===cat).length;
    const row=document.createElement('div'); row.className='crow';
    row.innerHTML=`<span class="cname">${esc(cat)}</span><span class="ccnt">${cnt}문항</span><span class="cbtn rn">이름변경</span><span class="cbtn d del">삭제</span>`;
    row.querySelector('.rn').onclick=()=>{
      const n=prompt('새 이름', cat);
      if(!n||!n.trim()||n.trim()===cat) return;
      const name=n.trim();
      if(allCats().includes(name)){ alert('이미 있는 이름'); return; }
      DATA.forEach(d=>{ if(d.cat===cat) d.cat=name; });
      META.extraCats=META.extraCats.map(c=>c===cat?name:c);
      if(curCat===cat) curCat=name;
      persist(); rebuildChips(); build(); renderCatRows();
    };
    row.querySelector('.del').onclick=()=>{
      const msg=cnt?`"${cat}" 삭제?`:`"${cat}" 삭제?`;
      if(!confirm(msg)) return;
      DATA.forEach(d=>{ if(d.cat===cat) d.cat="기타"; });
      META.extraCats=META.extraCats.filter(c=>c!==cat);
      if(curCat===cat) curCat="전체";
      persist(); rebuildChips(); build(); renderCatRows();
    };
    box.appendChild(row);
  });
  if(!box.children.length) box.innerHTML='<div style="color:var(--dim);font-size:13px;padding:10px 0">카테고리 없음</div>';
}

<body>
<header><h1 id="t"></h1></header>
<div id="app"></div>
<script>
const QD=__DATA__;
var CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var cats=['전체'];
QD.data.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
var selCat='전체', impOnly=false, cnt='전체', gradeMode=true;

document.title=QD.title+' 퀴즈';

// ===== 키워드 추출/채점 =====
var STOP=['또는','다만','그리고','있는','있을','있고','하는','하고','한다','된다','되는','해당','다른','모든','후에','때문','대한','아닐','않는','않을','않음','이하','이상','미만','초과','경우','위해','따라'];
function stripP(t){
  t=t.replace(/(에게|에서|으로|까지|부터|하여|되어|은|는|이|가|을|를|의|와|과|로|에|도|만)$/,'');
  if(t.length>=3 && /[시됨함임]$/.test(t)) t=t.slice(0,-1); // 체결시→체결, 차단됨→차단 (현시·즉시 등 2글자는 유지)
  return t;
}
function keywords(q){
  var text=(q.secs||[]).map(function(s){return s.t;}).join(' ')+' '+q.items.join(' ')+(q.note?' '+q.note:'');
  var toks=text.split(/[^0-9A-Za-z가-힣]+/);
  var out=[], seen={};
  toks.forEach(function(t){
    if(t.length<2) return;
    t=stripP(t);
    if(t.length<2) return;
    if(STOP.indexOf(t)>=0) return;
    var k=t.toLowerCase();
    if(seen[k]) return;
    seen[k]=1; out.push(t);
  });
  return out;
}
function norm(s){ return String(s).toLowerCase().replace(/\\s+/g,''); }
function grade(q, userText){
  var kws=keywords(q), u=norm(userText);
  var hit=[], miss=[];
  kws.forEach(function(k){ (u.indexOf(norm(k))>=0?hit:miss).push(k); });
  var pct=kws.length?Math.round(hit.length/kws.length*100):0;

}
function judgeOf(pct){
  if(pct>=70) return {t:'정답', c:'var(--ok)'};
  if(pct>=40) return {t:'부분 정답', c:'var(--acc2)'};
  return {t:'오답', c:'var(--no)'};
}

function filterPool(){ return QD.data.filter(function(d){ return (selCat==='전체'||d.cat===selCat)&&(!impOnly||d.imp); }); }
function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function startScreen(){

  app.querySelectorAll('#cntCh .chip').forEach(function(el){ el.onclick=function(){ cnt=el.dataset.n; app.querySelectorAll('#cntCh .chip').forEach(function(x){x.classList.toggle('on',x.dataset.n===cnt);}); }; });

function begin(){

function revealOnly(q){
  var h=qHead(q);

  (q.secs||[]).forEach(function(s){ h+='<div class="ph">'+esc(s.l||'현상')+': '+esc(s.t)+'</div>'; });

function reveal(q, userText){

  h+='<div class="sec"><div class="st">모범답안</div>';
  (q.secs||[]).forEach(function(s){ h+='<div class="ph">'+esc(s.l||'현상')+': '+esc(s.t)+'</div>'; });
  h+='<ol class="ans">';
  q.items.forEach(function(it,j){ h+='<li><b>'+(CIRC[j]||(j+1)+'.')+'</b>'+esc(it)+'</li>'; });
  h+='</ol>';
  if(q.note) h+='<div class="nt">'+esc(q.note).replace(/\\n/g,'<br>')+'</div>';
  h+='</div>';
  if(g.hit.length){ h+='<div class="sec"><div class="st">✔ 포함한 키워드</div><div>'; g.hit.forEach(function(k){h+='<span class="kw hit">'+esc(k)+'</span>';}); h+='</div></div>'; }
  if(g.miss.length){ h+='<div class="sec"><div class="st">✘ 빠진 키워드</div><div>'; g.miss.forEach(function(k){h+='<span class="kw miss">'+esc(k)+'</span>';}); h+='</div></div>'; }
  h+='<button class="big" id="nx">'+(idx+1>=pool.length?'결과 보기 ▶':'다음 문제 ▶')+'</button>';
  h+='</div><button class="quit" id="qt">그만하기</button>';
  app.innerHTML=h;
  document.getElementById('nx').onclick=function(){ idx++; showQ(); window.scrollTo(0,0); };
  document.getElementById('qt').onclick=function(){ if(confirm('그만하고 처음으로?')) startScreen(); };
}
function end(){

}
startScreen();

function quizHTML(){
  const src = WS!=='exam' ? DATA : DATA.flatMap(d=>(d.refs||[]).map((r,j)=>{ const t=findRef(r); return t?{num:d.num+'-Q'+(j+1), cat:d.cat, title:'['+partOf(r)+'] '+(r.q||t.title), secs:t.secs, ph:t.ph, phLabel:t.phLabel, items:t.items, note:t.note}:null; }).filter(Boolean));
  const snap={title:META.title, phLabel:phL(), data:src.map(d=>({num:d.num, cat:d.cat, title:d.title, imp:d.imp||0, secs:(d.secs||(d.ph?[{l:d.phLabel||"현상", t:d.ph}]:[])), items:d.items, note:d.note||""}))};
  return QUIZ_TPL.replace('__DATA__', ()=>JSON.stringify(snap));
}
function switchTab(t){
  const quiz = t==='quiz';
  document.body.classList.toggle('mode-quiz', quiz);
  const pane=document.getElementById('quizPane');
  pane.innerHTML='';
  if(quiz){
    const fr=document.createElement('iframe');
    fr.srcdoc=quizHTML();
    pane.appendChild(fr);
    window.scrollTo(0,0);
    placeQuiz();
  }
  updateTabs();
}
function placeQuiz(){
  if(!document.body.classList.contains('mode-quiz')) return;
  document.body.classList.remove('hdr-hide');
  const tb=document.querySelector('.tabs'), pane=document.getElementById('quizPane');
  pane.style.top=Math.max(0,Math.ceil(tb.getBoundingClientRect().bottom))+'px';
}
// 헤더 높이 기록 + 폰에서 아래로 스크롤하면 헤더 숨기고 위로 올리면 다시 보이기
(function(){
  const hd=document.querySelector('header');
  const setH=()=>{ document.documentElement.style.setProperty('--hh', hd.offsetHeight+'px'); placeQuiz(); };
  if(window.ResizeObserver) new ResizeObserver(setH).observe(hd);
  window.addEventListener('resize',setH); window.addEventListener('orientationchange',()=>setTimeout(setH,300));
  if(window.visualViewport) visualViewport.addEventListener('resize',setH);
  setH();
  let lastY=window.scrollY;
  window.addEventListener('scroll',()=>{
    const y=Math.max(0,window.scrollY), b=document.body;
    const busy=b.classList.contains('mode-quiz') || document.querySelector('.catbar.open') || hd.contains(document.activeElement) || window.innerWidth>700;
    if(busy || y<hd.offsetHeight){ b.classList.remove('hdr-hide'); }
    else if(y>lastY+8){ b.classList.add('hdr-hide'); }
    else if(y<lastY-8){ b.classList.remove('hdr-hide'); }
    if(Math.abs(y-lastY)>8 || y<hd.offsetHeight) lastY=y;
  },{passive:true});
})();
const NOTICEKEY='jg_notice_seen';
const DEFAULT_NOTICE={title:'📢 공지',
  body:'전기동차 2종 면허 취득을 위해 만든 실기·구술 정리 자료입니다.\n모든 문항은 교과서를 기반으로 제작했습니다.\n자유롭게 이용하시고, 고칠 점이나 필요한 것이 있으면 단톡방으로 연락해 주세요.\n모두의 합격을 기원합니다! 🍀',
  cats:'구술: 구술시험 문항과 답안 정리\n기능: 기능시험 상황별 조치와 보고 멘트\n퀴즈: 보고 있던 탭의 문항으로 주관식 연습\n기출 시나리오: 회차별 기출을 준비점검·조치·구술로 나눠 정답 확인', ts:0};
function fileNotice(){ return JSON.parse(JSON.stringify((EMBED&&EMBED.notice)||DEFAULT_NOTICE)); }
let NOTICE=null;
function noticeHTML(n){
  let h=`<h2>${esc(n.title||'')}</h2>`;
  if((n.body||'').trim()) h+=`<div class="nb">${esc(n.body.trim()).replace(/\n/g,'<br>')}</div>`;
  const cl=(n.cats||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(cl.length) h+='<div class="nl">'+cl.map(x=>{ const k=x.indexOf(':'); return k>0?`<div><b>${esc(x.slice(0,k).trim())}</b>${esc(x.slice(k+1).trim())}</div>`:`<div>${esc(x)}</div>`; }).join('')+'</div>';
  return h;
}
function showNotice(force){
  if(!VIEW_ONLY && !force) return;
  const upd=EMBED&&EMBED.upd;
  const seen=+(safeLS(()=>localStorage.getItem(NOTICEKEY))||0);
  const nts=Math.max(upd?upd.ts:0, (NOTICE&&NOTICE.ts)||0);
  if(!force && seen && !(nts>seen)) return;
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='noticeOv';
  let h='<div class="modal">'+noticeHTML(NOTICE||fileNotice());
  if(upd && upd.titles && upd.titles.length && !force){
    const t=upd.titles, max=30;
    h+=`<div class="nu"><div class="nh">업데이트 ${fmtTs(upd.ts)}</div><ul>${t.slice(0,max).map(x=>`<li>${esc(x)}</li>`).join('')}${t.length>max?`<li>외 ${t.length-max}건</li>`:''}</ul></div>`;
  }
  h+=`<div class="mbtns"><div class="mb" id="noticeOk">확인</div></div></div>`;
  ov.innerHTML=h;
  const close=()=>{ ov.remove(); if(!force) safeLS(()=>localStorage.setItem(NOTICEKEY, String(Math.max(nts, 1)))); };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector('#noticeOk').onclick=close;
  document.body.appendChild(ov);
}
function openNoticeEd(){
  const n=NOTICE||fileNotice();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='noticeEdOv';
  ov.innerHTML=`<div class="modal ned"><h2>📢 공지 편집</h2>
    <label>제목</label><input type="text" class="n-t" value="${esc(n.title||'')}">
    <label>본문</label><textarea class="n-b" rows="7">${esc(n.body||'')}</textarea>
    <label>탭 소개</label><textarea class="n-c" rows="5">${esc(n.cats||'')}</textarea>
    <div class="mbtns"><div class="mb" id="nPrev">미리보기</div><div class="mb" id="nSave">저장</div><div class="mb" id="nClose">닫기</div></div></div>`;
  document.body.appendChild(ov);
  const g=c=>ov.querySelector(c), cur=()=>({title:g('.n-t').value.trim(), body:g('.n-b').value.replace(/\s+$/,''), cats:g('.n-c').value.replace(/\s+$/,'')});
  g('#nClose').onclick=()=>ov.remove();
  g('#nPrev').onclick=()=>{ const keep=NOTICE; NOTICE=Object.assign({},n,cur()); showNotice(true); NOTICE=keep; };
  g('#nSave').onclick=()=>{
    const c=cur(), same=c.title===n.title && c.body===n.body && c.cats===n.cats;
    if(!same){ NOTICE=Object.assign({},n,c,{ts:Date.now()}); persist(); }
    ov.remove();
  };
}
function closeQuiz(){ if(document.body.classList.contains('mode-quiz')) switchTab('main'); }

// ===== 칩 =====
const chips=document.getElementById('chips');
function toggleCats(force){
  const bar=document.querySelector('.catbar');
  bar.classList.toggle('open', force===undefined ? !bar.classList.contains('open') : force);
}
function rebuildChips(){
  const cats=["전체", ...new Set([...DATA.map(d=>d.cat), ...META.extraCats])];
  if(!cats.includes(curCat)) curCat="전체";
  chips.innerHTML="";
  cats.forEach(cat=>{
    const n = cat==="전체" ? DATA.length : DATA.filter(d=>d.cat===cat).length;
    const el=document.createElement('div');
    el.className='crow2'+(cat===curCat?' on':'');
    el.innerHTML=`<span>${esc(cat)}</span><span class="cn">${n}</span>`;
    el.onclick=()=>{ curCat=cat; chips.querySelectorAll('.crow2').forEach(x=>x.classList.toggle('on',x===el)); document.getElementById('catCur').textContent=cat; toggleCats(false); filter(); };
    chips.appendChild(el);
  });
  document.getElementById('catCur').textContent=curCat;
  let dl=document.getElementById('catList');
  if(!dl){dl=document.createElement('datalist'); dl.id='catList'; document.body.appendChild(dl);}
  dl.innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join("");
}

// ===== 검색 + 필터 + 하이라이트 =====
const q=document.getElementById('q');
q.addEventListener('input',filter);

function allOpen(v){document.querySelectorAll('.card:not(.hide)').forEach(c=>c.classList.toggle('open',v));}
function nsp(x){ return String(x).toLowerCase().replace(/\s+/g,''); }
function kwRegex(kw){ return new RegExp([...kw].map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*'),'gi'); }
function filter(){
  const kw=nsp(q.value);
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const d=DATA[c.dataset.i]; if(!d) return;
    if(+c.dataset.i===editingIdx){c.classList.remove('hide'); shown++; return;}
    c.querySelectorAll('.s').forEach(el=>{
      const raw=el.dataset.raw||(el.dataset.raw=el.innerHTML);
      if(!kw){el.innerHTML=raw; return;}
      el.innerHTML=raw.split(/(<[^>]+>)/g).map(seg=>seg.startsWith('<')?seg:
        seg.replace(kwRegex(kw), m=>`<mark>${m}</mark>`)).join("");
    });
    const hay=(d.num+" "+d.title+" "+((d.secs||(d.ph?[{l:d.phLabel||"",t:d.ph}]:[])).map(s=>s.l+" "+s.t).join(" "))+" "+d.items.join(" ")+" "+(d.note||"")+" "+(d.refs||[]).map(r=>{const t=findRef(r); return (r.q||'')+' '+(r.a||'')+' '+(t?t.title:'');}).join(" ")).toLowerCase().replace(/\s+/g,'');
    const ok=(!kw||hay.includes(kw)) && (curCat==="전체"||d.cat===curCat) && (!impOnly||d.imp);
    c.classList.toggle('hide',!ok);
    if(ok){shown++; if(kw) c.classList.add('open');}
    if(!kw && ok && curCat==="전체" && !impOnly) c.classList.remove('open');
  });
  document.getElementById('stat').textContent=`${shown}건 표시`+(kw?` · "${q.value}" 검색중`:"");
  let em=document.getElementById('emptyMsg');
  if(shown===0){ if(!em){em=document.createElement('div'); em.id='emptyMsg'; em.className='empty'; em.textContent=DATA.length===0?'문항 없음':'검색 결과 없음'; list.appendChild(em);} }
  else if(em){em.remove();}
}

// ===== 시작 =====
(async()=>{
  load(); sortData(); rebuildChips(); build(); applyFold();
  showNotice();
})();
